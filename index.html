<style>
  /* 1. The Viewport: Defines the visible window size */
  .crop-container {
    width: 1200px;          /* Visible area width */
    height: 600px;         /* Visible area height */
    overflow: hidden;      /* Hide everything outside the window */
    position: relative;
    border: 2px solid #333;
  }

  /* 2. The Frame: Shifted to expose the target section */
  .crop-container iframe {
    position: absolute;
    
    /* Offsets: Negative values push the page UP and LEFT */
    top: -350px;           /* Hide top 200px of the target page */
    left: -10px;          /* Hide left 150px of the target page */
    
    /* Full target page size (ensures original site layout doesn't break) */
    width: 1200px;         
    height: 600px;        
    border: none;
  }
</style>
